name: Genesis Node 3 Attestation

on:
  push:
    branches: [main]
    paths:
      - 'node.json'
      - 'scripts/attest.py'
      - '.github/workflows/attest.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe primary chain and write attestation
        env:
          GENESIS_NODE_PRIVATE_KEY_PEM: ${{ secrets.GENESIS_NODE_PRIVATE_KEY_PEM }}
        run: python scripts/attest.py
      - name: Publish attestation
        shell: bash
        run: |
          git config user.name "Genesis Node 3"
          git config user.email "genesis-node-3@users.noreply.github.com"
          git add attestation.json
          if [ -f node_public_key.pem ]; then git add node_public_key.pem; fi
          if git diff --cached --quiet; then
            echo "No attestation change"
            exit 0
          fi
          git commit -m "Attest Genesis blockchain head"
          git push
